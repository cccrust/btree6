[package]
name = "btree6"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"

[lib]
name = "btree6"
path = "src/lib.rs"

[[bin]]
name = "btree6"
path = "src/main.rs"